[build]
  publish = "src"
  functions = "netlify/functions"
  # Only build when something in apps/app changed (exit 0 = skip)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security headers. connect-src allows only our own Supabase project.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https://btatxcipmsvcriddxlhv.supabase.co wss://btatxcipmsvcriddxlhv.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
