<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f2f2f7">
  <title>Eigenes Passwort – mxCoaching</title>
  <script src="/core/theme.js"></script>
  <link rel="stylesheet" href="/core/theme.css">
</head>
<body>
  <main class="page auth-page" hidden id="main">
    <div class="auth-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div>
    <h1>Eigenes Passwort setzen</h1>
    <p class="muted">Bevor es losgeht: Ersetze das Startpasswort durch ein eigenes. Nur du kennst es, auch Max nicht.</p>

    <form id="pw-form" class="card" novalidate>
      <!-- hidden username helps password managers save the right entry -->
      <input id="username" name="username" autocomplete="username" hidden>

      <label for="pw1">Neues Passwort (mind. 10 Zeichen)</label>
      <input id="pw1" name="pw1" type="password" autocomplete="new-password" minlength="10" required>

      <label for="pw2">Neues Passwort wiederholen</label>
      <input id="pw2" name="pw2" type="password" autocomplete="new-password" minlength="10" required>

      <button type="submit" id="submit">Passwort speichern</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <button type="button" class="secondary" id="logout">Abmelden</button>
  </main>

  <script src="/vendor/supabase-2.117.2.js"></script>
  <script type="module" src="/core/pages/password.js"></script>
</body>
</html>
