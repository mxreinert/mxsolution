<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Max Reinert</title>
<meta name="description" content="Trainings- und Ernährungsgedanken von Max Reinert.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mxreinert.de/blog.html">
<meta property="og:title" content="Blog — Max Reinert">
<meta property="og:description" content="Trainings- und Ernährungsgedanken von Max Reinert.">
<meta property="og:image" content="https://mxreinert.de/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blog — Max Reinert">
<meta name="twitter:image" content="https://mxreinert.de/og-image.png">
<style>
  :root{
    --bg:#0a0e14;
    --bg-soft:#121a24;
    --line:#1f2733;
    --text:#f5f6f7;
    --muted:#93a1b0;
    --accent:#ff7a45;
    --accent2:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  header{
    padding:20px clamp(20px,6vw,64px) 0;
  }
  header a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
  }
  header a:hover{color:var(--accent2);}
  main{
    max-width:760px;
    margin:0 auto;
    padding:32px clamp(20px,6vw,64px) 60px;
  }
  h1{
    font-size:clamp(2.2rem,6vw,3.2rem);
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 24px;
  }
  .post-card{
    display:block;
    text-decoration:none;
    color:var(--text);
    border:1px solid var(--line);
    background:var(--bg-soft);
    border-radius:16px;
    overflow:hidden;
    margin-bottom:14px;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .post-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent2);
    box-shadow:0 12px 30px rgba(45,212,191,.15);
  }
  .post-card img{
    display:block;
    width:100%;
    max-height:280px;
    object-fit:cover;
  }
  .post-card .body{padding:16px 20px;}
  .post-card .date{
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent2);
    margin:0 0 8px;
  }
  .post-card h2{
    margin:0 0 8px;
    font-size:1.3rem;
  }
  .post-card p{
    margin:0;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
  }
  .empty{
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:16px;
    padding:40px;
    text-align:center;
  }
  footer{
    padding:24px clamp(20px,6vw,64px) 32px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    color:var(--muted);
    font-size:13px;
    border-top:1px solid var(--line);
  }
  footer a{color:var(--muted); text-decoration:none;}
  footer a:hover{color:var(--accent2);}
  .footer-links{display:flex; gap:18px; flex-wrap:wrap;}
</style>
</head>
<body>
  <header>
    <a href="index.html">&larr; Zurück</a>
  </header>

  <main>
    <h1>Blog</h1>
    <div id="posts"></div>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Max Reinert</span>
    <span class="footer-links">
      <a href="mailto:mxsports.business@gmail.com">mxsports.business@gmail.com</a>
      <a href="https://www.instagram.com/mx.sports10" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@mx.sports10" target="_blank" rel="noopener">TikTok</a>
    </span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function fmtDate(ts){
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    async function loadPosts(){
      const container = document.getElementById('posts');
      try {
        const res = await fetch('/api/posts');
        const data = await res.json();
        const posts = data.posts || [];
        if (posts.length === 0) {
          container.innerHTML = '<div class="empty">Noch keine Artikel &mdash; bald geht\'s los.</div>';
          return;
        }
        container.innerHTML = posts.map(p => `
          <a class="post-card" href="post.html?slug=${encodeURIComponent(p.slug)}">
            ${p.cover ? `<img src="${p.cover}" alt="">` : ''}
            <div class="body">
              <p class="date">${fmtDate(p.publishedAt)}</p>
              <h2>${escapeHtml(p.title)}</h2>
              <p>${escapeHtml(p.excerpt || '')}</p>
            </div>
          </a>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty">Artikel konnten nicht geladen werden.</div>';
      }
    }

    function escapeHtml(s){
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    loadPosts();
  </script>
</body>
</html>
