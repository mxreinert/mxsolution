<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — Max Reinert</title>
<meta name="description" content="Trainings- und Ernährungsgedanken von Max Reinert.">
<meta property="og:type" content="article">
<meta property="og:title" content="Blog — Max Reinert">
<meta property="og:description" content="Trainings- und Ernährungsgedanken von Max Reinert.">
<meta property="og:image" content="https://mxreinert.de/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mxreinert.de/og-image.png">
<style>
  :root{
    --bg:#0a0e14;
    --bg-soft:#121a24;
    --line:#1f2733;
    --text:#f5f6f7;
    --muted:#93a1b0;
    --accent:#ff7a45;
    --accent2:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  header{
    padding:20px clamp(20px,6vw,64px) 0;
  }
  header a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
  }
  header a:hover{color:var(--accent2);}
  main{
    max-width:720px;
    margin:0 auto;
    padding:28px clamp(20px,6vw,64px) 60px;
  }
  .cover{
    width:100%;
    max-height:400px;
    object-fit:cover;
    border-radius:16px;
    margin:0 0 22px;
    display:none;
  }
  .meta{
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent2);
    margin:0 0 12px;
  }
  h1{
    font-size:clamp(2rem,6vw,3rem);
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.1;
    margin:0 0 22px;
  }
  article{
    color:var(--text);
    font-size:1.1rem;
    line-height:1.75;
  }
  article p{margin:0 0 22px;}
  article img{max-width:100%; border-radius:12px; margin:8px 0 22px;}
  article h2{margin:36px 0 16px; font-size:1.5rem;}
  .empty{
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:16px;
    padding:40px;
    text-align:center;
  }
  footer{
    padding:24px clamp(20px,6vw,64px) 32px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    color:var(--muted);
    font-size:13px;
    border-top:1px solid var(--line);
  }
  footer a{color:var(--muted); text-decoration:none;}
  footer a:hover{color:var(--accent2);}
  .footer-links{display:flex; gap:18px; flex-wrap:wrap;}
</style>
</head>
<body>
  <header>
    <a href="blog.html">&larr; Zurück zum Blog</a>
  </header>

  <main>
    <img class="cover" id="cover" alt="">
    <p class="meta" id="meta"></p>
    <h1 id="title">Lädt&hellip;</h1>
    <article id="content"></article>
  </main>

  <footer>
    <span>&copy; <span id="year"></span> Max Reinert</span>
    <span class="footer-links">
      <a href="mailto:mxsports.business@gmail.com">mxsports.business@gmail.com</a>
      <a href="https://www.instagram.com/mx.sports10" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@mx.sports10" target="_blank" rel="noopener">TikTok</a>
    </span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function fmtDate(ts){
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    async function loadPost(){
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) return showNotFound();
      try {
        const res = await fetch('/api/posts?slug=' + encodeURIComponent(slug));
        if (!res.ok) return showNotFound();
        const data = await res.json();
        const post = data.post;
        document.title = post.title + ' — Max Reinert';
        document.getElementById('title').textContent = post.title;
        document.getElementById('meta').textContent = fmtDate(post.publishedAt);
        document.getElementById('content').innerHTML = post.contentHtml || '';
        if (post.cover) {
          const cover = document.getElementById('cover');
          cover.src = post.cover;
          cover.style.display = 'block';
        }
      } catch (e) {
        showNotFound();
      }
    }

    function showNotFound(){
      document.getElementById('title').textContent = 'Artikel nicht gefunden';
      document.getElementById('content').innerHTML = '<div class="empty">Dieser Artikel existiert nicht (mehr).</div>';
    }

    loadPost();
  </script>
</body>
</html>
